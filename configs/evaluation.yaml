generation:
  kind: hf
  hf:
    model_name: Qwen/Qwen2.5-Coder-0.5B-Instruct
    max_new_tokens: 128
    temperature: 0.0
    top_p: 1.0
    repetition_penalty: 1.0
    seed: 42
    device_map: cpu
    torch_dtype: float32
    trust_remote_code: false

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-aware-codegen"
version = "0.1.0"
description = "Dependency-aware hallucination detection and repair for LLM-generated Python code."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dependency-Aware Codegen Contributors"}]
dependencies = [
  "accelerate>=0.31",
  "datasets>=2.19",
  "peft>=0.11",
  "pyyaml>=6.0",
  "torch>=2.2",
  "transformers>=4.42"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5"
]
qlora = [
  "bitsandbytes>=0.43; platform_system != 'Windows'"
]

[project.scripts]
depguard = "depguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# Frozen model outputs include intentional defects; linting must not rewrite evidence.
extend-exclude = ["data/agent_failures", "data/interview_eval"]
